[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "idxexchange"
version = "1.0.0"
requires-python = "==3.11.*"
dependencies = [
    "altair>=5.0",
    "category-encoders>=2.6.0",
    "joblib>=1.3.0",
    "lightgbm>=4.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "Pillow>=10.0.0",
    "qrcode>=7.4",
    "scikit-learn>=1.3.0",
    "streamlit>=1.28.0",
    "xgboost>=2.0.0",
]
